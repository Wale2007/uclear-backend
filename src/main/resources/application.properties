# ─────────────────────────────────────────────
# Uclear Backend — Application Configuration
# ─────────────────────────────────────────────

spring.application.name=uclear-backend
server.port=${PORT:8080}

# ── MySQL Database Configuration ──────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/uclear_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Pool Resiliency (Prevents Render Status 1 Crash) ───
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── JPA / Hibernate ─────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT Configuration ───────────────────────────
# Replace this with a long random secret string (min 64 chars)
app.jwt.secret=UclearFUTA2026SecretKeyForJWTTokenGenerationMustBeAtLeast64CharactersLong!
app.jwt.expiration-ms=86400000

# ── CORS (Allow React frontend + Vercel Production) ────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://uclear.vercel.app

# ── Flutterwave Webhook Secret ──────────────────
app.flutterwave.secret-hash=YOUR_FLUTTERWAVE_SECRET_HASH


# ── File Upload (CSV/Excel bulk import) ─────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ─────────────────────────────────────
logging.level.ng.edu.futa.uclear=DEBUG
logging.level.org.springframework.security=INFO

# ── Disable unused auto-configurations to prevent startup crash ──
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
